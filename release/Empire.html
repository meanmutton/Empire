:root { --bg:#070b16; --panel:#0e1426ee; --panel2:#141c33; --line:#26304f; --text:#e6ebf5; --dim:#9aa6c4; --accent:#ffd166; --good:#7cfc9a; --bad:#ff6b6b; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#app { position:fixed; inset:0; }
.btn { background:#1d2747; color:var(--text); border:1px solid #33416b; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
.btn:hover:not(:disabled) { background:#273463; }
.btn:disabled { opacity:.45; cursor:default; }
.btn.primary { background:#c99a2e; border-color:#e7b94c; color:#130e02; font-weight:600; }
.btn.primary:hover:not(:disabled) { background:#e0ad3a; }
.btn.danger { background:#5a1d26; border-color:#8a2c3a; }
.btn.ghost { background:transparent; border-color:transparent; }
.btn.small { padding:2px 7px; font-size:12px; }
.chip { display:inline-flex; align-items:center; gap:5px; }
.chip .dot { width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 6px var(--c); }
.chip .glyph { flex:none; filter:drop-shadow(0 0 3px var(--c)); }
.dim { color:var(--dim); }
.good { color:var(--good); } .bad { color:var(--bad); }
.row { display:flex; align-items:center; gap:8px; }
.row.wrap { flex-wrap:wrap; }
.grow { flex:1; }
.bar { height:5px; background:#0a0f1e; border-radius:3px; overflow:hidden; min-width:40px; }
.bar-fill { height:100%; }
h3 { margin:12px 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600; }

#map { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
#topbar { position:absolute; left:0; right:0; top:0; height:46px; display:flex; align-items:center; gap:14px; padding:0 12px;
  background:linear-gradient(#0b1122f5, #0b1122d0); border-bottom:1px solid var(--line); z-index:5; overflow-x:auto; white-space:nowrap; }
#topbar .res { display:flex; align-items:center; gap:4px; }
#topbar .btn { padding:4px 8px; }
#topbar { gap:10px; }
#topbar { overflow:hidden; padding:0; gap:0; }
#topbar .top-more { display:none; flex:none; align-self:stretch; padding:0 10px; border:none; border-left:1px solid var(--line); background:#0b1122; color:var(--accent); font-size:18px; cursor:pointer; }
#topbar.overflowing .top-more { display:block; }
#topbar.overflowing .top-scroll { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image:linear-gradient(to right, #000 calc(100% - 36px), transparent); }

 paid off: −30% damage.`},photonicWeapons:{name:`Photonic Weapons`,text:`Energy weapons +25%.`},stellarFeeding:{name:`Stellar Feeding`,text:`Double energy from stars.`},cryxAssimilation:{name:`Assimilation`,text:`20% of enemy ships destroyed in their battles rise again as Cryx ships at 25% hull.`},fortressWorlds:{name:`Fortress Worlds`,text:`Planetary defenses +100%.`},stampede:{name:`Stampede`,text:`+20% attack in their own territory.`},advancedEngines:{name:`Advanced Engines`,text:`+1 movement for all ships.`},prototypeLab:{name:`Prototype Lab`,text:`Technology trades with them cost 30% less.`},conversion:{name:`Conversion`,text:`Missionaries raise unrest by 5 per turn (up to 60) in foreign systems within 3 hexes, and other factions think better of them.`},smugglers:{name:`Smugglers`,text:`Their systems cannot be blockaded, and their cargo ships draw 90% less fire and cannot be boarded.`},freePort:{name:`Free Port`,text:`Anyone in contact may trade with them without an embassy.`},forHire:{name:`For Hire`,text:`Rents out veteran armies for 10 turns on the mercenary market.`},veterans:{name:`Veterans`,text:`Armies start at Elite rank.`},oceanWorlds:{name:`Ocean Worlds`,text:`+50% population capacity on habitable worlds.`},deepShelters:{name:`Deep Shelters`,text:`Systems can never be bombarded below 1 population.`},longRangeSensors:{name:`Long-Range Sensors`,text:`Sensor range +3.`},starCharts:{name:`Star Charts`,text:`Sells copies of its star charts (everything it has explored) on the mercenary market.`},sporePayload:{name:`Spore Payload`,text:`Attacks on systems also kill population.`},livingHulls:{name:`Living Hulls`,text:`Ships regenerate 20% hull per turn.`},crystallineHulls:{name:`Crystalline Hulls`,text:`Hull +40%.`},slowThought:{name:`Slow Thought`,text:`−1 movement for all ships.`},huntersInstinct:{name:`Hunter's Instinct`,text:`+30% damage against ships that are already damaged.`},tracking:{name:`Tracking`,text:`Reveals cloaked ships within 2 hexes.`},royal
