name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the relay Lambda package
        run: npm run relay:bundle && cd relay/.build && zip -q lambda.zip lambda.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: relay-lambda
          path: relay/.build/lambda.zip
          retention-days: 30
